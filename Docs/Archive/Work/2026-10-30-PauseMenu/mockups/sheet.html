<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><title>Pause menu concepts</title>
<style>
	html, body { height: 1200px; background: #12151A; }
	.head { position: absolute; left: 58px; top: 10px; font-weight: 700; font-size: 30px; letter-spacing: .2em; color: var(--text); }
	.head span { color: var(--label); font-weight: 400; font-size: 22px; letter-spacing: .12em; margin-left: 18px; }
	.cell { position: absolute; width: 873px; height: 491px; border: 3px solid rgba(212,238,244,.5); overflow: hidden; }
	.cell img { width: 100%; height: 100%; display: block; }
	.tag { position: absolute; display: flex; align-items: center; gap: 16px; }
	.tag b { display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; font-size: 40px; color: #12151A; background: var(--gold);
		clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
	.tag span { font-weight: 700; font-size: 38px; letter-spacing: .12em; color: var(--gold); }
</style></head>
<body>

	<div class="tag" style="left:989px;top:54px"><b>B</b><span>OPEN RANGE</span></div>
	<div class="cell" style="left:989px;top:112px"><img src="B_hub.png"></div>
	<div class="tag" style="left:58px;top:620px"><b>C</b><span>TAG RACK</span></div>

</body></html>
