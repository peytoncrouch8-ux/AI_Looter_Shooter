; The experience curve (Project Settings > Game > Progression, UProgressionSettings): level L to L+1 takes
; round(BaseXP x Growth^(L-1)) experience, up to MaxLevel. 100 XP for the first level-up and 12% more for each one after
; makes the whole climb to 70 about 2.07 million XP.
[/Script/AI_Looter_Shooter.ProgressionSettings]
MaxLevel=70
BaseXP=100
Growth=1.120000

; Packaging a test build (Tools/package.ps1 passes the same choices to RunUAT BuildCookRun; File > Package Project reads
; this section). A Windows Development build: logs and the console stay in; content goes into compressed IoStore
; containers. The cooker only takes what the maps refer to by a hard or soft reference, so the assets the C++ loads by
; path (LoadObject, FindIfMade, soft pointers built in constructors) are listed under DirectoriesToAlwaysCook. Without
; them the game still starts, but shows its stand-in shapes or skips the loot tables and fonts, quietly.
[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
BuildTarget=AI_Looter_Shooter
FullRebuild=False
ForDistribution=False
UsePakFile=True
bUseIoStore=True
; Cook straight to Saved\Cooked (the engine default is the Zen server): nothing else has to run during a cook.
bUseZenStore=False
bCompressed=True
IncludePrerequisites=True
bCookAll=False
; Editor content stays cookable: the engine's Landmass plugin loads startup materials that refer to /Engine/EditorMaterials.
bSkipEditorContent=False

