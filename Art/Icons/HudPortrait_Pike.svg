<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
<!--
Wendell Pike, the Surveyor: his HUD portrait (the user's pick 2026-10-19, "A The Surveyor": Art/Portraits/Picks/Pike.png),
drawn as Ellis's (Art/Icons/HudPortrait.svg: the same groups, glass, ink weights, misregistration and framing) and read
by Art/Icons/HudPortrait.py ("HudPortrait.py Pike"). A stocky old surveyor: brown bowler with brass goggles pushed up on
it, round wire spectacles with cyan eyes behind them, grey mutton chops joined to a big mustache, a teal neckerchief, the
khaki field coat with its collar up and chest pockets, the tripod's brass-shod legs over his right shoulder.

Layers, back to front (ids below):
  glass       Ellis's dark blue glass with faint scanlines
  colour      the flat fills, offset 1.3 x 0.9 units from the ink
  rim         the cyan rim light along the hat and the left shoulder
  ink         the ink lines (#0a1218), 1.2-3 units wide
  eyes-open   the resting eyes behind the spectacles: two glowing cyan slits, and the calm brows
  eyes-hurt   narrow eyes and brows pulled down
  eyes-flare  wide glowing eyes for a level-up
-->
