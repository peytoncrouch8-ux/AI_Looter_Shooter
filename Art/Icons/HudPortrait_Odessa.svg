<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
<!--
Odessa Lark, the Cardsharp: her HUD portrait (the user's pick 2026-10-19, "A The Dealer": Art/Portraits/Picks/Odessa.png),
drawn as Ellis's (Art/Icons/HudPortrait.svg: the same groups, glass, ink weights, misregistration and framing) and read
by Art/Icons/HudPortrait.py ("HudPortrait.py Odessa"). A riverboat gambler: the flat-crowned black hat with a wine-red
band and a playing card tucked in it (a plain spade pip, no deck's art), dark hair to the jaw, cyan eyes under the brim
with one brow raised, a half smile, gold drop earrings, the white high collar and black cravat with a gold pin, the gold
brocade waistcoat, the wine-red tailcoat.

Layers, back to front (ids below):
  glass       Ellis's dark blue glass with faint scanlines
  colour      the flat fills, offset 1.3 x 0.9 units from the ink
  rim         the cyan rim light along the hat and the left shoulder
  ink         the ink lines (#0a1218), 1.2-3 units wide
  eyes-open   the resting eyes: two glowing cyan slits, the brows (her left one raised) and the lash flicks
  eyes-hurt   narrow eyes and brows pulled down
  eyes-flare  wide glowing eyes for a level-up
-->
