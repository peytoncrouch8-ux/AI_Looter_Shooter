<title>Ransom's Rest Style Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: a full-window game view; the lab's controls sit at the top centre (never over the HUD's corners) and fold away. */
:root {
  color-scheme: dark;
  --void: #06090c;
  --glass: rgba(9, 14, 20, 0.74);
  --glass-hi: rgba(18, 27, 37, 0.9);
  --line: rgba(90, 200, 255, 0.42);
  --line-dim: rgba(90, 200, 255, 0.18);
  --orange: #ff9f1c;
  --orange-ink: #1a0e00;
  --cyan: #5ac8ff;
  --ink: #e8edf2;
  --dim: #93a3b1;
  --font: 'Chakra Petch', 'Bahnschrift', 'Segoe UI', system-ui, sans-serif;
}
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; }
[hidden] { display: none !important; }
body { font: 500 14px/1.4 var(--font); }
#lab { position: fixed; inset: 0; background: var(--void); }
#stage { position: absolute; inset: 0; }
#stage > canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
#lab.locked #clickhint { opacity: 0; }

/* the top centre bar */
#ui { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(1180px, calc(100% - 32px));
  display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 20; }
#ui > * { pointer-events: auto; }
.glass { background: var(--glass); border: 1px solid var(--line-dim); box-shadow: inset 0 1px 0 rgba(90, 200, 255, 0.08), 0 6px 18px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
#stylebar { display: flex; gap: 2px; padding: 4px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
#stylebar::-webkit-scrollbar { display: none; }
.chip { appearance: none; border: 0; background: transparent; color: var(--dim); font: 600 12.5px/1 var(--font); letter-spacing: 0.04em;
  text-transform: uppercase; padding: 7px 10px 7px 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; }
.chip b { font-weight: 700; color: var(--cyan); min-width: 1.1em; text-align: center; font-variant-numeric: tabular-nums; }
.chip:hover { color: var(--ink); background: rgba(90, 200, 255, 0.07); }
.chip.on { color: var(--orange-ink); background: var(--orange); border-bottom-color: #ffd08a; }
.chip.on b { color: var(--orange-ink); }
.chip:focus-visible, .btn:focus-visible, select:focus-visible { outline: 1px solid var(--cyan); outline-offset: 1px; }
#subbar { display: flex; align-items: center; gap: 6px; padding: 3px 6px; flex-wrap: wrap; justify-content: center; }
#family { color: var(--orange); font: 600 11px/1 var(--font); letter-spacing: 0.14em; text-transform: uppercase; padding: 0 8px;
  border-right: 1px solid var(--line-dim); }
.btn { appearance: none; background: transparent; color: var(--ink); border: 1px solid var(--line-dim); font: 600 11.5px/1 var(--font);
  letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 9px; cursor: pointer; }
.btn:hover { border-color: var(--line); background: rgba(90, 200, 255, 0.08); }
.btn.on { border-color: var(--orange); color: var(--orange); }
select { appearance: none; background: var(--glass-hi); color: var(--ink); border: 1px solid var(--line-dim); font: 600 12px/1 var(--font);
  letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 22px 6px 9px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--cyan) 50%), linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
  background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
#ui.folded #stylebar, #ui.folded #subbar > :not(#fold) { display: none; }
#ui.folded #subbar { padding: 0; background: transparent; border: 0; box-shadow: none; }
#help { position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  color: var(--dim); font: 500 11.5px/1.3 var(--font); letter-spacing: 0.05em; text-align: center; pointer-events: none;
  max-width: min(620px, calc(100% - 32px)); text-shadow: 0 1px 2px #000; }
#lab.locked #help { opacity: 0; }
#help kbd { font: 600 10.5px/1 var(--font); color: var(--ink); border: 1px solid var(--line-dim); padding: 1px 4px; margin: 0 1px; background: rgba(0, 0, 0, 0.35); }
#ui[hidden] ~ #help, #lab.clean #help, #lab.clean #clickhint, #lab.clean #stats { display: none; }
#clickhint { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); z-index: 15; pointer-events: none; transition: opacity 0.3s;
  font: 600 13px/1 var(--font); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); padding: 9px 16px; }
#stats { position: absolute; left: 50%; top: calc(96px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 19; color: var(--dim);
  font: 500 10.5px/1 var(--font); letter-spacing: 0.06em; pointer-events: none; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
#toast { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 25; pointer-events: none; opacity: 0;
  transition: opacity 0.25s; font: 700 28px/1 var(--font); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink);
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
#toast.show { opacity: 1; }

/* the style card */
#card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100% - 32px)); max-height: min(78vh, 820px);
  overflow: auto; z-index: 30; padding: 22px 26px 20px; }
#card h2 { margin: 0; font: 700 26px/1.1 var(--font); letter-spacing: 0.03em; text-transform: uppercase; text-wrap: balance; }
#card h3 { margin: 16px 0 6px; font: 600 11px/1 var(--font); letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan); }
#card p { margin: 6px 0; color: var(--ink); max-width: 66ch; }
#card .tagline { color: var(--orange); font-weight: 600; font-size: 15px; }
#card .card-head { display: flex; gap: 14px; align-items: center; border-bottom: 1px solid var(--line-dim); padding-bottom: 12px; margin-bottom: 8px; }
#card .num { font: 700 40px/1 var(--font); color: var(--orange); min-width: 1.2em; font-variant-numeric: tabular-nums; }
#card .tag { display: inline-block; margin-top: 6px; font: 600 10.5px/1 var(--font); letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan);
  border: 1px solid var(--line); padding: 3px 6px; }
#card ul, #card ol { margin: 4px 0; padding-left: 20px; }
#card li { margin: 3px 0; }
#card a { color: var(--cyan); }
#card .note { color: var(--dim); }
#card .cost { display: flex; gap: 22px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line-dim); flex-wrap: wrap; }
#card .cost .k { display: block; font: 600 10.5px/1 var(--font); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
#card .cost .v { font: 700 20px/1 var(--font); color: var(--orange); }
#card .risks { flex: 1; min-width: 240px; }
#cardClose { position: absolute; right: 12px; top: 12px; }

/* loading */
#loading { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 60%, #121b24 0%, var(--void) 70%);
  transition: opacity 0.5s; }
#loading.gone { opacity: 0; pointer-events: none; }
#loading .box { width: min(460px, calc(100% - 32px)); text-align: center; }
#loading .eyebrow { font: 600 11px/1 var(--font); letter-spacing: 0.3em; color: var(--cyan); text-transform: uppercase; }
#loading h1 { margin: 10px 0 18px; font: 700 34px/1.05 var(--font); letter-spacing: 0.06em; text-transform: uppercase; }
#loading h1 span { color: var(--orange); }
#loading .track { height: 4px; background: rgba(90, 200, 255, 0.14); position: relative; overflow: hidden; }
#loadbar { position: absolute; left: 0; top: 0; bottom: 0; width: 2%; background: var(--orange); box-shadow: 0 0 12px rgba(255, 159, 28, 0.6); transition: width 0.25s; }
#loadtext { margin-top: 10px; color: var(--dim); font: 500 12px/1.3 var(--font); letter-spacing: 0.08em; min-height: 1.3em; }
#loading.err #loadtext { color: var(--orange); }
@media (max-width: 1280px) { #help { display: none; } }
@media (max-width: 640px) {
  .chip span { display: none; }
  #card { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { #loadbar, #loading, #toast, #clickhint { transition: none; } }
</style>
<div id="lab">
  <div id="stage"></div>
  <div id="ui">
    <nav id="stylebar" class="glass" aria-label="Art styles"></nav>
    <div id="subbar" class="glass">
      <span id="family"></span>
      <button class="btn" id="shotPrev" type="button" aria-label="Previous shot">&lsaquo;</button>
      <select id="shot" aria-label="Shot"></select>
      <button class="btn" id="shotNext" type="button" aria-label="Next shot">&rsaquo;</button>
      <button class="btn on" id="hudToggle" type="button">HUD</button>
      <button class="btn" id="cardToggle" type="button">Style card</button>
      <button class="btn" id="fold" type="button" aria-label="Fold the style bar">&#9652;</button>
    </div>
  </div>
  <div id="stats"></div>
  <div id="help"><kbd>Click</kbd> walk &middot; <kbd>WASD</kbd> <kbd>Shift</kbd> sprint <kbd>Space</kbd> jump &middot; <kbd>LMB</kbd> fire <kbd>RMB</kbd> aim <kbd>R</kbd> reload &middot;
    <kbd>`</kbd> today <kbd>1</kbd>&ndash;<kbd>0</kbd> styles &middot; <kbd>V</kbd>/<kbd>B</kbd> shots &middot; <kbd>H</kbd> HUD <kbd>I</kbd> card <kbd>U</kbd> clean &middot; <kbd>Esc</kbd> release</div>
  <div id="clickhint" class="glass">Click to play</div>
  <div id="toast"></div>
  <section id="card" class="glass" hidden aria-label="Style card">
    <button class="btn" id="cardClose" type="button" aria-label="Close the card">Close</button>
    <div id="cardBody"></div>
  </section>
  <div id="loading">
    <div class="box">
      <div class="eyebrow">Ransom's Rest &middot; ten looks, one town</div>
      <h1>Style <span>Lab</span></h1>
      <div class="track"><div id="loadbar"></div></div>
      <div id="loadtext">Starting</div>
    </div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="engine/main.js"></script>
