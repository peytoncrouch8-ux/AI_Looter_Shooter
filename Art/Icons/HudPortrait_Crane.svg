<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
<!--
Hollis Crane, the Unpaid: his HUD portrait (the user's pick 2026-10-19, "A The Marshal": Art/Portraits/Picks/Crane.png),
drawn as Ellis's (Art/Icons/HudPortrait.svg: the same groups, glass, ink weights, misregistration and framing) and read
by Art/Icons/HudPortrait.py ("HudPortrait.py Crane"). A dead marshal: battered slouch hat with a torn brim, long white
hair, drooping white mustache, grey-green skin, a tarnished coin over his LEFT eye (the viewer's right) and cyan light in
the RIGHT socket, the ragged shoulder cape, the rusted toll chain over his right shoulder, the tin star.

Layers, back to front (ids below):
  glass       Ellis's dark blue glass with faint scanlines
  colour      the flat fills, offset 1.3 x 0.9 units from the ink
  rim         the cyan rim light along the hat and the left shoulder
  ink         the ink lines (#0a1218), 1.2-3 units wide
  eyes-open   the one living eye: the cyan light in his right socket, and the calm brows (the coin stays put)
  eyes-hurt   the light narrowed and the brows pulled down
  eyes-flare  the light blazing for a level-up, and a glint off the coin
-->
