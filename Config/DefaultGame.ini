; Packaging a test build (Tools/package.ps1 passes the same choices to RunUAT BuildCookRun; File > Package Project reads
; this section). A Windows Development build: logs and the console stay in; content goes into compressed IoStore
; containers. The cooker only takes what the maps refer to by a hard or soft reference, so the assets the C++ loads by
; path (LoadObject, FindIfMade, soft pointers built in constructors) are listed under DirectoriesToAlwaysCook. Without
; them the game still starts, but shows its stand-in shapes or skips the loot tables and fonts, quietly.
[/Script/UnrealEd.ProjectPackagingSettings]
