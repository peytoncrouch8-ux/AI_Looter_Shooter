BuildConfiguration=PPBC_Development
BuildTarget=AI_Looter_Shooter
FullRebuild=False
ForDistribution=False
UsePakFile=True
bUseIoStore=True
; Cook straight to Saved\Cooked (the engine default is the Zen server): nothing else has to run during a cook.
