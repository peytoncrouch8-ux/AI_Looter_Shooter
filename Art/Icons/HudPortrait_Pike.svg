<radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e6fbff" stop-opacity="1"/><stop offset="0.3" stop-color="#7fd8ff" stop-opacity="0.7"/><stop offset="1" stop-color="#5ccaff" stop-opacity="0"/></radialGradient>
<pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#5ac8ff" opacity="0.08"/></pattern>
