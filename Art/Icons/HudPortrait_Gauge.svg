<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
<!--
Gauge, the Iron Hand: its HUD portrait (the user's pick 2026-10-19, "C Company Iron": Art/Portraits/Picks/Gauge.png),
drawn as Ellis's (Art/Icons/HudPortrait.svg: the same groups, glass, ink weights, misregistration and framing) and read
by Art/Icons/HudPortrait.py ("HudPortrait.py Gauge"). The railroad's clockwork track-layer: a squared iron head in black
enamel and polished brass, one headlamp eye with warm white light (#ffe2a8, not cyan), a grille mouth, the brass
nameplate GAUGE on the brow, domed pauldrons, the stack behind its right shoulder, the red enamelled crest and the
pressure gauge on its boiler chest.

Layers, back to front (ids below):
  glass       Ellis's dark blue glass with faint scanlines
  colour      the flat fills, offset 1.3 x 0.9 units from the ink
  rim         the cyan rim light along the head, the stack and the left pauldron
  ink         the ink lines (#0a1218), 1.2-3 units wide
  eyes-open   the lit headlamp (its glow warm, not cyan) and the visor's brass lip tucked under the hood: the blink
              shutters the lamp to a slit and open again
  eyes-hurt   the visor dropped over the top of the lamp, the light dimmed under it
  eyes-flare  the lamp blazing white with a cross of light for a level-up
-->
